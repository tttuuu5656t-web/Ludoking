
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0754b9">
<title>LudoKing Home</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;font-family:Arial,sans-serif;color:white;
 background-color:#0754b9;
 background-image:
 radial-gradient(circle at 20% 20%,#ffffff18 2px,transparent 3px),
 radial-gradient(circle at 80% 60%,#ffffff13 3px,transparent 4px),
 linear-gradient(135deg,#063675,#1674e6,#063675);
 background-size:50px 50px,65px 65px,100% 100%;
 min-height:100vh;
}
.top{
 display:flex;align-items:center;justify-content:space-around;
 background:#082d70;border-bottom:3px solid #ffc52e;
 padding:12px 5px;position:sticky;top:0;z-index:5;
}
.profile{font-size:28px}
.coins{
 background:#071c58;border:2px solid #eab52b;
 border-radius:12px;padding:8px 10px;font-weight:bold;
}
.gear{font-size:26px}
.container{max-width:520px;margin:auto;padding:12px}
.hero{text-align:center;padding:28px 0 20px}
.hero .logo{font-size:80px;filter:drop-shadow(0 5px 5px #001b55)}
.hero h1{
 font-size:42px;margin:0;color:#ffe34e;
 text-shadow:2px 3px #12346d,0 0 10px #ffc52e;
}
.hero p{font-size:13px;color:#d9eaff;letter-spacing:2px}
.ludo-art{
 margin:18px auto 28px;width:210px;height:155px;
 display:flex;align-items:center;justify-content:center;
 position:relative;
}
.board-art{
 width:150px;height:150px;transform:rotate(45deg);
 display:grid;grid-template-columns:1fr 1fr;
 border:5px solid #f9cf3b;border-radius:12px;
 box-shadow:0 8px 15px #001d58;
}
.board-art span:nth-child(1){background:#e83a45}
.board-art span:nth-child(2){background:#1ba36d}
.board-art span:nth-child(3){background:#317bdc}
.board-art span:nth-child(4){background:#e9bd32}
.pawn{position:absolute;font-size:52px;text-shadow:0 4px 4px #001b55}
.p1{left:-8px;bottom:0}
.p2{right:-8px;bottom:0}
.dice-art{position:absolute;font-size:52px;top:20px}
.section{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.game{
 background:linear-gradient(145deg,#1680ed,#0750b5);
 border:3px solid #ffca29;border-radius:18px;
 box-shadow:0 5px 0 #9b5a08,0 7px 12px #001c56;
 min-height:126px;padding:10px 4px;
 text-align:center;color:white;text-decoration:none;
 display:flex;flex-direction:column;align-items:center;justify-content:center;
 cursor:pointer;
}
.game:active{transform:translateY(4px);box-shadow:0 1px 0 #9b5a08}
.game .emoji{font-size:42px;margin-bottom:7px}
.game b{
 font-size:clamp(12px,3.5vw,17px);
 text-shadow:1px 2px #14234b;
}
.game small{color:#baffad;font-weight:bold;margin-top:5px}
.section.two{grid-template-columns:repeat(2,1fr);max-width:340px;margin:20px auto}
.section.two .game{min-height:140px}
.special{
 display:flex;align-items:center;justify-content:center;
 gap:20px;margin:35px 0 25px;
}
.special button{
 border:3px solid #ffd23e;background:linear-gradient(#1d83ed,#074caa);
 border-radius:18px;color:white;padding:12px;font-size:35px;
}
.claim{
 background:linear-gradient(#ffe978,#f3a800);color:#782d00;
 padding:13px 28px;border-radius:12px;font-size:24px;
 font-weight:900;border:3px solid #fff2a1;
}
.bottom{
 position:sticky;bottom:0;background:#073578;
 display:grid;grid-template-columns:repeat(5,1fr);
 border-top:3px solid #3b9bff;margin-top:25px;
}
.bottom button{
 background:transparent;color:white;border:0;padding:10px 2px;
 font-size:11px;font-weight:bold;
}
.bottom span{display:block;font-size:27px;margin-bottom:5px}
.bottom button.active{background:#1479df}
.popup{
 display:none;position:fixed;inset:0;background:#000b;z-index:10;
 align-items:center;justify-content:center;padding:20px;
}
.popup-box{
 background:#123b77;border:3px solid #ffd23e;
 border-radius:20px;padding:22px;width:100%;max-width:370px;text-align:center;
}
.popup-box h2{color:#ffdc4a}
.popup-box button{
 padding:12px;border:0;border-radius:10px;margin:5px;
 background:#ffd23e;color:#18264a;font-weight:bold;
}
</style>
</head>
<body>

<div class="top">
 <div class="profile" onclick="show('Profile')">👨🏻</div>
 <div class="gear" onclick="show('Settings')">⚙️</div>
 <div class="coins">💎 50 <span>➕</span></div>
 <div class="coins">🪙 3,150 <span>➕</span></div>
 <div class="gear" onclick="show('Shop')">🛒</div>
</div>

<div class="container">

 <div class="hero">
  <div class="logo">👑</div>
  <h1>LUDO KING</h1>
  <p>PLAY • ROLL • WIN</p>
 </div>

 <div class="ludo-art">
  <div class="board-art"><span></span><span></span><span></span><span></span></div>
  <div class="pawn p1">🔵</div>
  <div class="pawn p2">🟡</div>
  <div class="dice-art">🎲</div>
 </div>

 <div class="section">
  <button class="game" onclick="show('Online')">
   <span class="emoji">🌍</span><b>ONLINE</b><small>Play Online</small>
  </button>
  <button class="game" onclick="show('Team Up')">
   <span class="emoji">⚔️</span><b>TEAM UP</b><small>Play Together</small>
  </button>
  <button class="game" onclick="show('Friends')">
   <span class="emoji">❤️</span><b>FRIENDS</b><small>Invite Friends</small>
  </button>
 </div>

 <div class="section two">
  <button class="game" onclick="computer()">
   <span class="emoji">📱</span><b>COMPUTER</b><small>Play With Computer</small>
  </button>
  <button class="game" onclick="passPlay()">
   <span class="emoji">👥</span><b>PASS N PLAY</b><small>One Phone Multiplayer</small>
  </button>
 </div>

 <div class="special">
  <button onclick="show('Mini Games')">🎲</button>
  <div class="claim" onclick="show('Tournament')">🏆 TOURNAMENT</div>
  <button onclick="show('Themes')">🎨</button>
 </div>

 <div style="text-align:center;margin:25px">
  <button class="claim" onclick="show('Rewards')">🎁 CLAIM REWARD</button>
 </div>

 <div class="section two">
  <button class="game" onclick="show('Dice Themes')">
   <span class="emoji">🎲</span><b>DICE THEMES</b>
  </button>
  <button class="game" onclick="show('Inventory')">
   <span class="emoji">🎒</span><b>INVENTORY</b>
  </button>
 </div>

</div>

<div class="bottom">
 <button class="active" onclick="location.href='index.html'"><span>🏠</span>HOME</button>
 <button onclick="show('Event')"><span>📅</span>EVENT</button>
 <button onclick="show('Adda')"><span>🎤</span>ADDA</button>
 <button onclick="show('Inventory')"><span>🎒</span>INVENTORY</button>
 <button onclick="show('Social')"><span>💬</span>SOCIAL</button>
</div>

<div class="popup" id="popup">
 <div class="popup-box">
  <h2 id="popupTitle">LudoKing</h2>
  <p id="popupText"></p>
  <button onclick="closePopup()">बंद करें</button>
 </div>
</div>

<script>
function show(name){
 document.getElementById("popupTitle").textContent=name;
 document.getElementById("popupText").textContent=
 name+" फीचर अभी तैयार किया जा रहा है।";
 document.getElementById("popup").style.display="flex";
}
function closePopup(){
 document.getElementById("popup").style.display="none";
}
function computer(){
 localStorage.setItem("ludoMode","computer");
 location.href="offline.html";
}
function passPlay(){
 localStorage.setItem("ludoMode","pass");
 location.href="offline.html";
}
</script>

</body>
</html>
