
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LudoKing</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(145deg,#101827,#202f48);
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 420px;
    text-align: center;
    background: #19263b;
    padding: 28px 20px;
    border-radius: 22px;
    box-shadow: 0 15px 40px #0006;
}

.logo {
    font-size: 65px;
}

h1 {
    color: #ffd34e;
    font-size: 34px;
    margin: 8px 0;
}

.subtitle {
    color: #b7c4d8;
    margin-bottom: 28px;
}

button {
    width: 100%;
    padding: 16px;
    margin: 8px 0;
    border: none;
    border-radius: 12px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.offline {
    background: #ffd34e;
    color: #182033;
}

.online {
    background: #347de0;
    color: white;
}

input {
    width: 100%;
    padding: 14px;
    margin: 8px 0;
    border: 1px solid #50617b;
    border-radius: 10px;
    background: #101827;
    color: white;
    font-size: 16px;
}

#online {
    display: none;
    margin-top: 20px;
    padding-top: 15px;
    border-top: 1px solid #40506a;
}

.small {
    color: #aab8cc;
    font-size: 13px;
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">🎲</div>
    <h1>LudoKing</h1>
    <p class="subtitle">Play Together, Win Together!</p>

    <button class="offline"
    onclick="location.href='board.html'">
        🏠 Play Offline
        <br>
        <small>एक मोबाइल पर 2–4 खिलाड़ी</small>
    </button>

    <button class="online"
    onclick="showOnline()">
        🌐 Online Multiplayer
        <br>
        <small>अलग-अलग मोबाइल से खेलें</small>
    </button>

    <div id="online">

        <input id="playerName"
        placeholder="Your Name">

        <button class="offline" onclick="createRoom()">
            Create Room
        </button>

        <input id="roomCode"
        placeholder="Enter Room Code">

        <button class="online" onclick="joinRoom()">
            Join Room
        </button>

    </div>

    <p class="small">
        © 2026 LudoKing
    </p>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="client.js"></script>

<script>
function showOnline() {
    document.getElementById("online").style.display = "block";
}
</script>

</body>
</html>
