
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LudoKing - Offline</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#10182a;color:white;
 font-family:Arial,sans-serif;
 padding:18px;
}
.container{max-width:460px;margin:auto}
header{text-align:center;padding:12px}
.logo{font-size:55px}
h1{color:#ffd34e;margin:5px;font-size:32px}
.sub{color:#aebbd0;font-size:13px}
.card{
 background:linear-gradient(145deg,#263754,#19263d);
 border:1px solid #40516e;
 border-radius:18px;padding:17px;
 margin:15px 0;
 box-shadow:0 8px 20px #0004;
}
.heading{font-size:18px;font-weight:bold;margin-bottom:15px}
.gold{color:#ffd34e}
.counts{display:flex;gap:10px}
.counts button{
 flex:1;padding:14px;border:1px solid #526581;
 border-radius:12px;background:#18243a;
 color:white;font-weight:bold;font-size:19px;
}
.counts button.active{
 background:#ffd34e;color:#18243a;
 border-color:#ffd34e;
}
.player{
 display:flex;align-items:center;gap:10px;
 margin-top:13px;
}
.avatar{
 width:42px;height:42px;border-radius:12px;
 display:grid;place-items:center;font-size:23px;
}
.player input{
 flex:1;min-width:0;padding:12px;
 border-radius:9px;border:1px solid #536580;
 background:#111d31;color:white;font-size:15px;
}
select{
 width:100%;padding:13px;margin:7px 0 12px;
 border-radius:10px;background:#111d31;
 border:1px solid #536580;color:white;
}
.setting{
 display:flex;justify-content:space-between;
 align-items:center;padding:13px 0;
 border-bottom:1px solid #40516e;
}
input[type=checkbox]{width:22px;height:22px;accent-color:#ffd34e}
.start{
 width:100%;padding:17px;border:0;border-radius:13px;
 background:linear-gradient(90deg,#ffbd35,#ffe477);
 color:#19243a;font-size:19px;font-weight:bold;
 box-shadow:0 5px 18px #ffbd3540;
}
.back{
 width:100%;margin-top:12px;padding:13px;
 background:#263754;color:white;border:1px solid #526581;
 border-radius:12px;
}
</style>
</head>

<body>
<div class="container">

<header>
 <div class="logo">🎲</div>
 <h1>LudoKing</h1>
 <div class="sub">OFFLINE MULTIPLAYER</div>
</header>

<div class="card">
 <div class="heading">👥 <span class="gold">Select Players</span></div>

 <div class="counts">
  <button class="active" onclick="setPlayers(2,this)">2</button>
  <button onclick="setPlayers(3,this)">3</button>
  <button onclick="setPlayers(4,this)">4</button>
 </div>

 <div id="players"></div>
</div>

<div class="card">
 <div class="heading">🎮 <span class="gold">Game Mode</span></div>

 <select id="mode">
  <option value="classic">🏆 Classic Ludo</option>
  <option value="quick">⚡ Quick Ludo</option>
 </select>

 <div class="heading">⚙️ <span class="gold">Game Rules</span></div>

 <label>Winning Rule</label>
 <select id="winning">
  <option value="all">All 4 tokens finish</option>
  <option value="one">First token finish</option>
 </select>

 <label>Six Rule</label>
 <select id="sixRule">
  <option value="extra">6 = Extra Turn</option>
  <option value="normal">No Extra Turn</option>
 </select>

 <label>Safe Cells</label>
 <select id="safe">
  <option value="yes">Safe Cells ON</option>
  <option value="no">Safe Cells OFF</option>
 </select>
</div>

<div class="card">
 <div class="heading">🔊 <span class="gold">Sound Settings</span></div>

 <div class="setting">
  Background Music
  <input type="checkbox" id="music" checked>
 </div>

 <div class="setting">
  Game Sound
  <input type="checkbox" id="sound" checked>
 </div>

 <div class="setting">
  Vibration
  <input type="checkbox" id="vibration" checked>
 </div>
</div>

<button class="start" onclick="startGame()">
 🚀 START GAME
</button>

<button class="back" onclick="location.href='index.html'">
 ← BACK TO HOME
</button>

</div>

<script>
let playerCount=2;
const colors=["Red","Green","Yellow","Blue"];
const avatars=["🔴","🟢","🟡","🔵"];

function setPlayers(count,button){
 playerCount=count;
 document.querySelectorAll(".counts button")
 .forEach(b=>b.classList.remove("active"));
 button.classList.add("active");
 makePlayers();
}

function makePlayers(){
 const box=document.getElementById("players");
 box.innerHTML="";

 for(let i=0;i<playerCount;i++){
  const row=document.createElement("div");
  row.className="player";
  row.innerHTML=`
   <div class="avatar" style="background:${["#9d3030","#187d50","#a47b1d","#245ba7"][i]}">
    ${avatars[i]}
   </div>
   <input id="name${i}" value="Player ${i+1}" maxlength="15">
  `;
  box.appendChild(row);
 }
}

function startGame(){
 const players=[];

 for(let i=0;i<playerCount;i++){
  players.push({
   name:document.getElementById("name"+i).value.trim()||"Player "+(i+1),
   color:colors[i]
  });
 }

 const settings={
  players,
  mode:document.getElementById("mode").value,
  winning:document.getElementById("winning").value,
  sixRule:document.getElementById("sixRule").value,
  safe:document.getElementById("safe").value,
  music:document.getElementById("music").checked,
  sound:document.getElementById("sound").checked,
  vibration:document.getElementById("vibration").checked
 };

 localStorage.setItem("ludoSettings",JSON.stringify(settings));
 location.href="board.html";
}

makePlayers();
</script>

</body>
</html>
