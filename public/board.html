
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LudoKing - Game</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #101522;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

header {
    padding: 18px;
    background: #192337;
    font-size: 25px;
    font-weight: bold;
    color: #ffd34e;
}

.game {
    max-width: 500px;
    margin: 25px auto;
    padding: 15px;
}

.board {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    background: #26334a;
    padding: 10px;
    border-radius: 15px;
}

.home {
    height: 145px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    font-size: 20px;
    font-weight: bold;
}

.red { background: #e84141; }
.green { background: #20a568; }
.yellow { background: #e5b832; color: #222; }
.blue { background: #347de0; }

.tokens {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 15px;
}

.token {
    background: rgba(255,255,255,0.2);
    border-radius: 50%;
    width: 35px;
    height: 35px;
    margin: auto;
    border: 3px solid white;
}

.center {
    margin-top: 12px;
    padding: 18px;
    background: #26334a;
    border-radius: 12px;
}

#dice {
    font-size: 65px;
    margin: 10px;
}

#turn {
    font-size: 19px;
    color: #ffd34e;
    font-weight: bold;
}

button {
    border: none;
    padding: 14px 25px;
    border-radius: 10px;
    background: #ffd34e;
    color: #171717;
    font-size: 16px;
    font-weight: bold;
    margin: 6px;
}

button:active {
    transform: scale(.96);
}
</style>
</head>

<body>

<header>🎲 LudoKing</header>

<div class="game">

    <div class="board">

        <div class="home red">
            RED
            <div class="tokens">
                <div class="token"></div>
                <div class="token"></div>
                <div class="token"></div>
                <div class="token"></div>
            </div>
        </div>

        <div class="home green">
            GREEN
            <div class="tokens">
                <div class="token"></div>
                <div class="token"></div>
                <div class="token"></div>
                <div class="token"></div>
            </div>
        </div>

        <div class="home blue">
            BLUE
            <div class="tokens">
                <div class="token"></div>
                <div class="token"></div>
                <div class="token"></div>
                <div class="token"></div>
            </div>
        </div>

        <div class="home yellow">
            YELLOW
            <div class="tokens">
                <div class="token"></div>
                <div class="token"></div>
                <div class="token"></div>
                <div class="token"></div>
            </div>
        </div>

    </div>

    <div class="center">
        <div id="dice">⚀</div>
        <p id="turn">Red ki baari</p>

        <button onclick="rollDice()">🎲 Roll Dice</button>
        <button onclick="nextTurn()">Next Turn</button>
    </div>

</div>

<script src="game.js"></script>

</body>
</html>
