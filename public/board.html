
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LudoKing Game</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#101827;color:white;
 font-family:Arial,sans-serif;padding:15px;
}
header{text-align:center;padding:12px;color:#ffd34e;font-size:27px;font-weight:bold}
#players{
 display:grid;grid-template-columns:1fr 1fr;
 gap:12px;margin-top:15px;
}
.player{
 min-height:145px;border:3px solid transparent;
 border-radius:16px;padding:12px;text-align:center;
 display:flex;flex-direction:column;justify-content:center;
 position:relative;
}
.player.active{border-color:white;box-shadow:0 0 18px #fff8}
.red{background:#d93640}
.green{background:#159b68}
.yellow{background:#d9ad27;color:#222}
.blue{background:#286fc5}
.player-name{font-size:18px;font-weight:bold}
.player-status{font-size:12px;margin-top:7px}
.dice{
 font-size:48px;background:#fff;color:#172033;
 width:75px;height:75px;border-radius:14px;
 display:grid;place-items:center;margin:10px auto;
 cursor:pointer;box-shadow:0 5px 12px #0005;
 user-select:none;
}
.dice.rolling{animation:roll .16s linear infinite}
@keyframes roll{
 0%{transform:rotate(0deg) scale(1)}
 50%{transform:rotate(180deg) scale(1.12)}
 100%{transform:rotate(360deg) scale(1)}
}
.panel{
 margin-top:18px;background:#26344d;
 border-radius:18px;padding:20px;text-align:center;
}
#turn{font-size:20px;font-weight:bold;color:#ffd34e}
#timerText{font-size:17px;margin:12px 0 7px}
.track{
 width:100%;height:13px;background:#46536a;
 border-radius:20px;overflow:hidden;
}
#timerBar{
 width:100%;height:100%;background:#22c878;
 transition:width 1s linear,background .3s;
}
#message{min-height:25px;color:#d5deeb;margin:13px 0}
.action{
 border:0;border-radius:12px;padding:14px 20px;
 background:#ffd34e;color:#182033;
 font-size:16px;font-weight:bold;margin:5px;
}
.action:disabled{opacity:.45}
#nextButton{display:none}
.back{
 display:block;margin:15px auto 0;background:#35445d;
 color:white;border:0;border-radius:10px;padding:12px 20px;
}
</style>
</head>
<body>

<header>🎲 LudoKing</header>

<div id="players"></div>

<div class="panel">
 <div id="turn">Red ki baari</div>
 <div id="timerText">15 सेकंड बाकी</div>
 <div class="track"><div id="timerBar"></div></div>

 <div class="dice" id="dice" role="button" tabindex="0">🎲</div>

 <div id="message">पासे को Touch करके Roll करें</div>

 <button class="action" id="nextButton">अगली बारी ➜</button>
</div>

<button class="back" onclick="location.href='index.html'">
 वापस जाएँ
</button>

<script>
const saved = JSON.parse(localStorage.getItem("ludoSettings") || "null");

const defaultPlayers = [
 {name:"Red",color:"Red"},
 {name:"Green",color:"Green"},
 {name:"Yellow",color:"Yellow"},
 {name:"Blue",color:"Blue"}
];

const players = saved && saved.players && saved.players.length >= 2
 ? saved.players : defaultPlayers;

const colors = {
 Red:"red",Green:"green",Yellow:"yellow",Blue:"blue"
};

const faces = ["⚀","⚁","⚂","⚃","⚄","⚅"];

let current = 0;
let seconds = 15;
let timer = null;
let hasRolled = false;
let rolling = false;

const playerBox = document.getElementById("players");
const dice = document.getElementById("dice");
const turn = document.getElementById("turn");
const timerText = document.getElementById("timerText");
const timerBar = document.getElementById("timerBar");
const message = document.getElementById("message");
const nextButton = document.getElementById("nextButton");

function drawPlayers(){
 playerBox.innerHTML = "";

 players.forEach((p,i)=>{
  const card = document.createElement("div");
  card.className = "player " + (colors[p.color] || "red");
  card.id = "player"+i;
  card.innerHTML = `
   <div class="player-name"></div>
   <div class="player-status"></div>
  `;
  card.querySelector(".player-name").textContent =
   p.name || p.color;
  playerBox.appendChild(card);
 });
}

function updateTurn(){
 players.forEach((p,i)=>{
  const card = document.getElementById("player"+i);
  card.classList.toggle("active",i===current);
  card.querySelector(".player-status").textContent =
   i===current ? "🎲 आपकी बारी" : "इंतजार करें";
 });

 turn.textContent = (players[current].name || players[current].color)
  + " की बारी";

 dice.textContent = "🎲";
 dice.style.pointerEvents = "auto";
 nextButton.style.display = "none";
 hasRolled = false;
 rolling = false;
 message.textContent = "पासे को Touch करके Roll करें";
 startTimer();
}

function startTimer(){
 clearInterval(timer);
 seconds = 15;
 updateTimer();

 timer = setInterval(()=>{
  seconds--;
  updateTimer();

  if(seconds <= 0){
   clearInterval(timer);
   message.textContent = "समय समाप्त! अगली बारी...";
   dice.style.pointerEvents = "none";

   setTimeout(nextPlayer,1000);
  }
 },1000);
}

function updateTimer(){
 timerText.textContent = seconds + " सेकंड बाकी";
 timerBar.style.width = (seconds/15*100) + "%";

 if(seconds <= 5){
  timerBar.style.background = "#ed3434";
  timerText.style.color = "#ff5555";
 }else{
  timerBar.style.background = "#22c878";
  timerText.style.color = "white";
 }
}

function rollDice(){
 if(hasRolled || rolling || seconds <= 0) return;

 clearInterval(timer);
 hasRolled = true;
 rolling = true;
 dice.classList.add("rolling");
 dice.style.pointerEvents = "none";
 message.textContent = "पासा घूम रहा है...";

 let count = 0;
 const animation = setInterval(()=>{
  const value = Math.floor(Math.random()*6);
  dice.textContent = faces[value];

  count++;
  if(count >= 12){
   clearInterval(animation);
   dice.classList.remove("rolling");
   rolling = false;
   dice.style.pointerEvents = "auto";

   const result = Math.floor(Math.random()*6)+1;
   dice.textContent = faces[result-1];
   message.textContent = "आपका पासा आया: " + result +
    " — अब अपनी चाल चलें";

   nextButton.style.display = "inline-block";
  }
 },100);
}

function nextPlayer(){
 clearInterval(timer);
 current = (current+1) % players.length;
 updateTurn();
}

dice.addEventListener("click",rollDice);
dice.addEventListener("keydown",e=>{
 if(e.key==="Enter" || e.key===" ") rollDice();
});

nextButton.addEventListener("click",()=>{
 if(!hasRolled) return;
 nextPlayer();
});

drawPlayers();
updateTurn();
</script>
</body>
</html>
