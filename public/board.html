
<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LudoKing Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1 style="text-align:center;color:#ffd34d;margin:20px">
            🎲 LudoKing
        </h1>

        <div class="ludo-board">

            <div class="home red">
                <div class="tokens">
                    <span>🔴</span><span>🔴</span>
                    <span>🔴</span><span>🔴</span>
                </div>
            </div>

            <div class="home green">
                <div class="tokens">
                    <span>🟢</span><span>🟢</span>
                    <span>🟢</span><span>🟢</span>
                </div>
            </div>

            <div class="center">
                <div class="center-text">🏆</div>
            </div>

            <div class="home yellow">
                <div class="tokens">
                    <span>🟡</span><span>🟡</span>
                    <span>🟡</span><span>🟡</span>
                </div>
            </div>

            <div class="home blue">
                <div class="tokens">
                    <span>🔵</span><span>🔵</span>
                    <span>🔵</span><span>🔵</span>
                </div>
            </div>

        </div>

        <div class="dice-section">
            <h2>Dice</h2>
            <div class="dice">🎲</div>
            <p>Waiting for game to start...</p>
        </div>

    </main>

</body>
</html>
